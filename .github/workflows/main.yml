name: Shop-Tests

on:
  repository_dispatch:
    types: [wp-updated]
  workflow_dispatch:
  schedule:
    # Täglicher Kontrolllauf, 05:40 UTC
    - cron: '40 5 * * *'

env:
  SITE_URL: https://www.zipf.com

jobs:
  check:
    runs-on: ubuntu-latest

    # Jeder fehlgeschlagene Befehl bricht den Job ab, auch in einer Pipe.
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Auslöser anzeigen
        run: |
          echo "Auslöser: ${{ github.event_name }}"
          echo "Art:      ${{ github.event.client_payload.run_type }}"
          echo "Site:     ${{ github.event.client_payload.site }}"
          echo "Änderungen:"
          echo "${{ github.event.client_payload.changes }}"

      - name: Schlüssel prüfen
        env:
          ZUM_KEY: ${{ secrets.ZUM_KEY }}
        run: |
          if [ -z "$ZUM_KEY" ]; then
            echo "::error::Secret ZUM_KEY ist nicht gesetzt."
            exit 1
          fi
          echo "Schlüssel vorhanden, Ziel: ${SITE_URL}"

      - name: Status abrufen
        env:
          ZUM_KEY: ${{ secrets.ZUM_KEY }}
        run: |
          curl -sS --fail-with-body \
            -H "X-Monitor-Key: ${ZUM_KEY}" \
            "${SITE_URL}/wp-json/zipf-update-monitor/v1/status" \
            -o status.json

          echo "--- Versionen ---"
          jq -r '.versions | to_entries[] | "\(.key): \(.value | if type == "object" then .name + " " + .version else . end)"' status.json

          echo "--- Warnungen ---"
          jq -r 'if (.warnings | length) == 0 then "keine" else .warnings[] end' status.json

          echo "--- Aktive Plugins ---"
          jq -r '.plugins | to_entries[] | select(.value.active) | "\(.value.name) \(.value.version)"' status.json

      - name: Seiten laden
        run: |
          set +e
          FEHLER=0
          for PFAD in / /shop/ /warenkorb/ /kasse/; do
            echo "--- ${PFAD} ---"
            CODE=$(curl -sSL -o seite.html -w '%{http_code}' "${SITE_URL}${PFAD}")
            echo "HTTP ${CODE}"
            test "$CODE" = "200" || FEHLER=1
            grep -nE 'Warning:|Notice:|Deprecated:|Fatal error' seite.html | head -5 && FEHLER=1
          done
          exit $FEHLER

          for PFAD in "/"

      - name: Ergebnis zurückmelden
        if: always()
        env:
          ZUM_KEY: ${{ secrets.ZUM_KEY }}
          RESULT: ${{ job.status }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS_CHECK=$([ "$RESULT" = "success" ] && echo ok || echo fail)
          cat > payload.json <<JSON
          {
            "result": "${RESULT}",
            "run_url": "${RUN_URL}",
            "summary": "Lauf ${{ github.run_number }}, Auslöser ${{ github.event_name }}",
            "checks": [
              { "name": "Seiten erreichbar und ohne PHP-Meldungen", "status": "${STATUS_CHECK}", "detail": "" }
            ]
          }
          JSON
          curl -sS -X POST \
            -H "X-Monitor-Key: ${ZUM_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "${SITE_URL}/wp-json/zipf-update-monitor/v1/report" \
            || echo "Rückmeldung fehlgeschlagen, Lauf selbst bleibt gewertet."

